<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- PWA Meta -->
    <meta name="theme-color" content="#F6F6F3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sudoku" />
    <meta name="description" content="A simple, calm, ad-free Sudoku. Daily puzzle, hints that teach, timed challenges and 11 themes. Works offline on phone and laptop." />

    <!-- Link previews (iMessage, WhatsApp, Slack, X, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sudoku" />
    <meta property="og:url" content="https://sudoku.tgoyal.me/" />
    <meta property="og:title" content="Sudoku: simple, calm, no ads" />
    <meta property="og:description" content="Daily puzzle, hints that teach, Blitz and other challenges, 11 themes. Free, works offline." />
    <meta property="og:image" content="https://sudoku.tgoyal.me/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Sudoku app: a puzzle in progress next to its main features." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sudoku: simple, calm, no ads" />
    <meta name="twitter:description" content="Daily puzzle, hints that teach, Blitz and other challenges, 11 themes. Free, works offline." />
    <meta name="twitter:image" content="https://sudoku.tgoyal.me/og.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>Sudoku</title>

    <style>
      html, body { margin: 0; padding: 0; overscroll-behavior: none; }
      body { background: inherit; }
      #root {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
    <script>
      // Paint the saved theme's background before React loads, so there's no flash.
      try {
        var boot = JSON.parse(localStorage.getItem("sudoku_boot") || "null");
        var bg = boot && /^#[0-9a-f]{6}$/i.test(boot.bg) ? boot.bg : null;
        document.documentElement.style.background = bg || (matchMedia("(prefers-color-scheme: dark)").matches ? "#151517" : "#F6F6F3");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
